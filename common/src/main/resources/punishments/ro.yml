# %check_name% - numele check-ului
# %description% - descrierea check-ului
# %vl% - încălcări
# %verbose% - informații suplimentare
# %player% - numele jucătorului
# [alert] - comandă specială pentru alertă
# [webhook] - comandă specială pentru alertă prin webhook-ul Discord
# [proxy] - comandă specială pentru alertă către alte servere conectate la proxy (BungeeCord/Velocity)

Punishments:
  Simulation:
    # După câte secunde ar trebui eliminată o încălcare?
    remove-violations-after: 300
    # Această secțiune va include toate check-urile cu acest nume,
    # Pentru a exclude un check care altfel ar fi inclus, pune un semn de exclamare în fața numelui
    # De exemplu, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Prag:Interval Comandă
    #
    # N este numărul de încălcări active necesar pentru a rula comanda.
    # Încălcările active sunt numărate în fereastra remove-violations-after.
    # M > 0 rulează la N, apoi la N+M, N+2M, ...
    # M = 0 rulează o singură dată când se atinge N.
    #
    # Exemple:
    # - "100:0 kick %player% incorrect movement!"   rulează o dată la flag-ul 100
    # - "100:50 say %player% is cheating"           rulează la flag-urile 100, 150, 200, ...
    # - "5:3 [alert]"                               rulează la flag-urile 5, 8, 11, 14, ...
    #
    commands:
      - "100:40 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  # Începând cu 2.2.10, nu există check-uri AutoClicker, iar acesta este doar un placeholder. Grim va include check-uri AutoClicker în viitor.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
