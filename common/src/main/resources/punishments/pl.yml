# %check_name% - nazwa kontroli
# %description% - opis kontroli
# %vl% - naruszenia
# %verbose% - dodatkowe informacje
# %player% - nazwa gracza
# [alert] - specjalna komenda wysyłająca alert
# [webhook] - specjalna komenda wysyłająca alert do webhooka Discorda
# [proxy] - specjalna komenda wysyłająca alert do innych serwerów połączonych z Twoim proxy (BungeeCord/Velocity)

Punishments:
  Simulation:
    # Po ilu sekundach naruszenie powinno zostać usunięte?
    remove-violations-after: 300
    # Ta sekcja obejmie wszystkie kontrole o tej nazwie,
    # Aby wykluczyć kontrolę, która w przeciwnym razie zostałaby objęta, umieść wykrzyknik przed jej nazwą
    # Na przykład !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Próg:Interwał Komenda
    #
    # N to liczba aktywnych naruszeń wymagana do wykonania komendy.
    # Aktywne naruszenia są liczone w oknie remove-violations-after.
    # M > 0 wykonuje przy N, potem N+M, N+2M, ...
    # M = 0 wykonuje jeden raz po osiągnięciu N.
    #
    # Przykłady:
    # - "100:0 kick %player% incorrect movement!"   wykonuje się raz przy fladze 100
    # - "100:50 say %player% is cheating"           wykonuje się przy flagach 100, 150, 200, ...
    # - "5:3 [alert]"                               wykonuje się przy flagach 5, 8, 11, 14, ...
    #
    commands:
      - "100:40 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
  # Od wersji 2.2.10 nie ma kontroli AutoClicker i jest to tylko placeholder. Grim doda kontrole AutoClicker w przyszłości.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
