# ===========================================================================
#  Setările backend-ului MySQL.
#
#  MySQL suportă configurații cu mai multe servere (mai multe instanțe Grim
#  care scriu într-o singură bază de date centrală). Necesită driver-ul MySQL
#  Connector/J la runtime; dacă driver-ul lipsește, backend-ul se dezactivează
#  la pornire și scrie o eroare clară în log, iar routing-ul care viza acest
#  backend trece pe ce altceva este configurat.
# ===========================================================================

# Fiecare cheie se află sub `mysql:`, astfel încât spațiul de chei al acestui
# fișier să nu se ciocnească cu fișierele celorlalte backend-uri (sqlite:,
# postgres:, mongo:, redis:) atunci când Configuralize le unește pe toate într-un singur namespace global.
mysql:
  # Ținta conexiunii.
  host: "localhost"
  port: 3306
  database: "grim"
  user: "root"
  password: ""

  # Setările pool-ului de conexiuni HikariCP. Se aplică doar backend-urilor SQL
  # care folosesc Hikari intern.
  pool-settings:
    # Numărul maxim de conexiuni fizice la baza de date pe care această instanță Grim le poate ține deschise.
    maximum-pool-size: 10
    # Numărul minim de conexiuni inactive ținute pregătite. Păstrează-l egal cu maximum-pool-size
    # pentru un pool de dimensiune fixă sau micșorează-l dacă baza ta de date are limite stricte.
    minimum-idle: 10
    # Retrage conexiunile după atâtea milisecunde. 1800000 sunt cele 30 de minute
    # implicite din Hikari; folosește 0 doar dacă baza de date/proxy-ul gestionează durata de viață.
    maximum-lifetime-ms: 1800000
    # Trimite periodic ping conexiunilor inactive. 0 dezactivează keepalive.
    keepalive-time-ms: 0
    # Timpul maxim de așteptare pentru o conexiune din pool înainte de eșec.
    connection-timeout-ms: 5000

  # Parametri URL suplimentari adăugați după setul standard
  # (useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true).
  # Lasă gol dacă nu știi sigur că ai nevoie de ceva anume — valorile implicite
  # corespund unei instalări locale de dezvoltare.
  extra-jdbc-params: ""

  # Limita de flush a batch-ului per handler. Fiecare handler al ring buffer-ului
  # adună evenimente într-un batch PreparedStatement și face commit la endOfBatch
  # SAU când batch-ul atinge această limită, oricare survine primul. Valorile mai
  # mari sacrifică latența pentru debit la vârfuri susținute de încărcare.
  batch-flush-cap: 256

  # Suprascrieri pentru numele tabelelor. Redenumește oricare dintre cele șase
  # stocări logice pentru ca mai multe instanțe Grim să poată partaja o singură bază
  # de date MySQL sau pentru a respecta o schemă de denumire existentă. Valorile implicite sunt mai jos.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Markeri de schemă — vezi comentariul din antetul config.yml.
config-flavor: V2
config-version: 2
