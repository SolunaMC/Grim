# ===========================================================================
#  Ustawienia backendu Postgres.
#
#  Postgres obsługuje wdrożenia wieloserwerowe (kilka instancji Grim
#  zapisujących do jednej centralnej bazy danych). Wymaga sterownika Postgres
#  JDBC w czasie działania; jeśli go brak, backend wyłącza się przy starcie,
#  a routing kierowany do tego backendu przechodzi na rozwiązanie zapasowe.
# ===========================================================================

# Każdy klucz znajduje się pod `postgres:`, aby przestrzeń kluczy tego pliku nie
# kolidowała z sąsiednimi plikami backendów, gdy Configuralize scala je
# wszystkie w jedną globalną przestrzeń nazw.
postgres:
  host: "localhost"
  port: 5432
  database: "grim"
  user: "postgres"
  password: ""

  # Ustawienia puli połączeń HikariCP. Dotyczą tylko backendów SQL,
  # które wewnętrznie używają Hikari.
  pool-settings:
    # Maksymalna liczba fizycznych połączeń z bazą, które ta instancja Grim może utrzymywać.
    maximum-pool-size: 5
    # Minimalna liczba bezczynnych połączeń utrzymywanych w gotowości. Ustaw tyle samo
    # co maximum-pool-size dla puli o stałym rozmiarze lub mniej, jeśli Twoja baza ma ścisłe limity.
    minimum-idle: 5
    # Wycofuje połączenia po tylu milisekundach. 1800000 to domyślne 30 minut
    # Hikari; używaj 0 tylko wtedy, gdy czasem życia zarządza Twoja baza/proxy.
    maximum-lifetime-ms: 1800000
    # Okresowo pinguje bezczynne połączenia. 0 wyłącza keepalive.
    keepalive-time-ms: 0
    # Maksymalny czas oczekiwania na połączenie z puli, zanim nastąpi błąd.
    connection-timeout-ms: 5000

  # Dodatkowe parametry URL dołączane po `?`. Zostaw puste, chyba że wiesz,
  # że potrzebujesz czegoś konkretnego.
  extra-jdbc-params: ""

  batch-flush-cap: 256

  # Nadpisania nazw tabel. Domyślne nazwy poniżej.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Znaczniki schematu — zobacz komentarz nagłówkowy w config.yml.
config-flavor: V2
config-version: 2
