# ===========================================================================
#  Ustawienia backendu MongoDB.
#
#  Wymaga sterownika MongoDB sync w czasie działania; jeśli go brak, backend
#  sam się wyłącza, a routing przechodzi na rozwiązanie zapasowe.
# ===========================================================================

# Każdy klucz znajduje się pod `mongo:`, aby przestrzeń kluczy tego pliku nie
# kolidowała z sąsiednimi plikami backendów, gdy Configuralize scala je
# wszystkie w jedną globalną przestrzeń nazw.
mongo:
  # Connection string MongoDB. Dane logowania zakodowane w adresie URL zgodnie
  # ze standardem sterownika (mongodb://user:pass@host:port/?authSource=admin).
  connection-string: "mongodb://localhost:27017"

  # Baza danych, do której zapisujemy. Kolekcje w tej bazie pochodzą
  # z bloku `tables:` poniżej.
  database: "grim"

  # Rozmiar bulkWrite() na handler. Sterownik Mongo wewnętrznie zarządza pulą
  # połączeń, więc to ustawienie kontroluje grupowanie zatwierdzeń, a nie liczbę połączeń.
  batch-flush-cap: 256

  # Nadpisania nazw kolekcji. Domyślne nazwy poniżej.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Znaczniki schematu — zobacz komentarz nagłówkowy w config.yml.
config-flavor: V2
config-version: 1
