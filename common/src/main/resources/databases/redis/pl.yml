# ===========================================================================
#  Ustawienia backendu Redis.
#
#  Redis to przede wszystkim magazyn w pamięci — upewnij się, że na serwerze
#  włączona jest trwałość AOF, jeśli kierujesz do niego historię, inaczej
#  historia zniknie po restarcie. Wymaga Jedis w czasie działania; jeśli go brak,
#  backend sam się wyłącza, a routing przechodzi na rozwiązanie zapasowe.
#
#  Niezalecany jako główny cel historii. Dostępny dla administratorów,
#  którzy mają tylko Redis i potrzebują czegoś działającego awaryjnie.
# ===========================================================================

# Każdy klucz znajduje się pod `redis:`, aby przestrzeń kluczy tego pliku nie
# kolidowała z sąsiednimi plikami backendów, gdy Configuralize scala je
# wszystkie w jedną globalną przestrzeń nazw.
redis:
  host: "localhost"
  port: 6379

  # Indeks logicznej bazy danych (domyślnie 0-15).
  database: 0

  # Opcjonalne dane logowania ACL. Zostaw puste dla Redisa bez uwierzytelniania.
  user: ""
  password: ""

  # Dodawany na początku każdego klucza zapisywanego przez ten backend. Przydatne,
  # gdy instancja Redis jest współdzielona z innymi aplikacjami. Zostaw puste, aby nie używać prefiksu.
  key-prefix: ""

  timeout-ms: 2000
  batch-flush-cap: 256

  # Gdy true, przy starcie zapisuje ostrzeżenie w logach, jeśli ten backend
  # obsługuje historię naruszeń/sesji. Ustaw false, aby je wyciszyć po upewnieniu się,
  # że trwałość jest skonfigurowana.
  warn-on-history: true

  # Nadpisania przestrzeni nazw kluczy. Interpretowane jako segmenty prefiksu klucza
  # (Redis nie ma natywnych tabel). Domyślne nazwy poniżej.
  tables:
    meta: grim_meta
    checks: grim_checks
    players: grim_players
    sessions: grim_sessions
    violations: grim_violations
    settings: grim_settings

# Znaczniki schematu — zobacz komentarz nagłówkowy w config.yml.
config-flavor: V2
config-version: 1
