# Experimental: comprobar a los jugadores de Bedrock (Geyser/Floodgate) en lugar de eximirlos.
# Solo se les aplican los checks de la lista, ver BEDROCK.md.

bedrock:
  enabled: false
  # Funciona como en punishments.yml: "Exploit" coincide con ExploitA y ExploitB.
  checks:
    - Crash
    - Exploit

# Marcadores de esquema — ver el comentario al principio de config.yml.
config-flavor: V2
config-version: 1
