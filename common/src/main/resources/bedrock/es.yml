bedrock:
    # Los jugadores de Bedrock (Geyser/Floodgate) no usan el movimiento de Java, por eso Grim los exime por defecto.
    # Activa esto para comprobarlos con los checks de la lista de abajo. Esta función es experimental.
    enabled: false
    # Solo estos checks pueden marcar a los jugadores de Bedrock. Un nombre coincide con cada check que lo contiene, así que "Exploit" cubre ExploitA y ExploitB.
    checks:
        - Crash
        - Exploit
    # Se añade delante del nombre de los jugadores de Bedrock en las alertas mediante el placeholder %platform%. Pon "" para desactivarlo.
    alert-tag: "&7[Bedrock] "

# Marcadores de esquema — ver el comentario de cabecera en config.yml.
config-flavor: V2
config-version: 1
