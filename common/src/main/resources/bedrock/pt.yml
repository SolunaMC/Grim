bedrock:
    # Jogadores Bedrock (Geyser/Floodgate) não usam o movimento do Java, por isso o Grim os isenta por padrão.
    # Ative isto para verificá-los com os checks listados abaixo. Este recurso é experimental.
    enabled: false
    # Apenas estes checks podem sinalizar jogadores Bedrock. Um nome corresponde a todo check que o contém, então "Exploit" cobre ExploitA e ExploitB.
    checks:
        - Crash
        - Exploit
    # Adicionado antes do nome dos jogadores Bedrock nos alertas pelo placeholder %platform%. Defina como "" para desativar.
    alert-tag: "&7[Bedrock] "

# Marcadores de esquema — ver o comentário do cabeçalho em config.yml.
config-flavor: V2
config-version: 1
