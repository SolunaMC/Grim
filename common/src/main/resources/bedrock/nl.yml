bedrock:
    # Bedrock-spelers (Geyser/Floodgate) gebruiken geen Java-beweging, daarom zondert Grim ze standaard uit.
    # Schakel dit in om ze in plaats daarvan te controleren met de checks hieronder. Deze functie is experimenteel.
    enabled: false
    # Alleen deze checks kunnen Bedrock-spelers flaggen. Een naam komt overeen met elke check die hem bevat, dus "Exploit" dekt ExploitA en ExploitB.
    checks:
        - Crash
        - Exploit
    # Tekst van de placeholder %platform% voor Bedrock-spelers, leeg voor Java-spelers. Voeg %platform% toe aan alerts-format in messages.yml om hem in alerts te tonen.
    alert-tag: "&7[Bedrock] "

# Schemamarkers — zie de header-comment in config.yml.
config-flavor: V2
config-version: 1
