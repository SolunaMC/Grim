bedrock:
    # Jucătorii Bedrock (Geyser/Floodgate) nu folosesc mișcarea Java, așa că Grim îi exceptează implicit.
    # Activează această opțiune pentru a-i verifica în schimb cu check-urile de mai jos. Această funcție este experimentală.
    enabled: false
    # Doar aceste check-uri pot semnala jucătorii Bedrock. Un nume se potrivește cu orice check care îl conține, deci "Exploit" acoperă ExploitA și ExploitB.
    checks:
        - Crash
        - Exploit

# Markeri de schemă — vezi comentariul din antetul config.yml.
config-flavor: V2
config-version: 1
