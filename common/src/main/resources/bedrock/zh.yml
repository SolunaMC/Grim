bedrock:
    # 基岩版玩家 (Geyser/Floodgate) 不使用 Java 的移动方式，因此 Grim 默认会豁免他们。
    # 启用此选项后，将改为使用下面列出的检查来检查他们。此功能是实验性的。
    enabled: false
    # 只有这些检查可以标记基岩版玩家。名称会匹配所有包含它的检查，因此 "Exploit" 涵盖 ExploitA 和 ExploitB。
    checks:
        - Crash
        - Exploit
    # 基岩版玩家的 %platform% 占位符文本，Java 版玩家为空。在 messages.yml 的 alerts-format 中加入 %platform% 即可在警报中显示。
    alert-tag: "&7[Bedrock] "

# 模式标记 — 参见 config.yml 顶部的注释。
config-flavor: V2
config-version: 1
