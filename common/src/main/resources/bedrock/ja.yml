bedrock:
    # Bedrock プレイヤー (Geyser/Floodgate) は Java の移動を使用しないため、Grim はデフォルトで除外します。
    # 有効にすると、代わりに下に記載したチェックで彼らをチェックします。この機能は実験的です。
    enabled: false
    # Bedrock プレイヤーをフラグできるのはこれらのチェックだけです。名前はそれを含むすべてのチェックに一致するため、"Exploit" は ExploitA と ExploitB に一致します。
    checks:
        - Crash
        - Exploit
    # アラートで %platform% プレースホルダーを通じて Bedrock プレイヤーの名前の前に追加されます。無効にするには "" に設定してください。
    alert-tag: "&7[Bedrock] "

# スキーマ用マーカー — config.yml のヘッダーコメントを参照。
config-flavor: V2
config-version: 1
