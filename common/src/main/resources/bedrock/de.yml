bedrock:
    # Bedrock-Spieler (Geyser/Floodgate) nutzen keine Java-Bewegung, daher nimmt Grim sie standardmäßig aus.
    # Aktiviere dies, um sie stattdessen mit den unten aufgeführten Checks zu prüfen. Diese Funktion ist experimentell.
    enabled: false
    # Nur diese Checks können Bedrock-Spieler flaggen. Ein Name trifft jeden Check, der ihn enthält, "Exploit" deckt also ExploitA und ExploitB ab.
    checks:
        - Crash
        - Exploit

# Schema-Marker — siehe Kopf-Kommentar in config.yml.
config-flavor: V2
config-version: 1
