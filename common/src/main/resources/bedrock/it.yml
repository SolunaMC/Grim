bedrock:
    # I giocatori Bedrock (Geyser/Floodgate) non usano il movimento Java, quindi Grim li esenta per impostazione predefinita.
    # Abilita questa opzione per controllarli invece con i check elencati sotto. Questa funzione è sperimentale.
    enabled: false
    # Solo questi check possono segnalare i giocatori Bedrock. Un nome corrisponde a ogni check che lo contiene, quindi "Exploit" copre ExploitA ed ExploitB.
    checks:
        - Crash
        - Exploit

# Marcatori di schema — vedi il commento di intestazione in config.yml.
config-flavor: V2
config-version: 1
