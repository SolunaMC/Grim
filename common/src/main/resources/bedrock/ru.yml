bedrock:
    # Игроки Bedrock (Geyser/Floodgate) не используют движение Java, поэтому Grim по умолчанию исключает их.
    # Включите это, чтобы вместо этого проверять их проверками из списка ниже. Эта функция экспериментальная.
    enabled: false
    # Только эти проверки могут флагать игроков Bedrock. Имя совпадает с каждой проверкой, которая его содержит, поэтому "Exploit" охватывает ExploitA и ExploitB.
    checks:
        - Crash
        - Exploit
    # Добавляется перед именем игроков Bedrock в оповещениях через плейсхолдер %platform%. Установите "", чтобы отключить.
    alert-tag: "&7[Bedrock] "

# Маркеры схемы — см. шапку config.yml.
config-flavor: V2
config-version: 1
