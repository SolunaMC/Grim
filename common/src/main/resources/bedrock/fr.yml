bedrock:
    # Les joueurs Bedrock (Geyser/Floodgate) n'utilisent pas le mouvement Java, Grim les exempte donc par défaut.
    # Activez cette option pour les vérifier avec les checks listés ci-dessous. Cette fonctionnalité est expérimentale.
    enabled: false
    # Seuls ces checks peuvent signaler les joueurs Bedrock. Un nom correspond à chaque check qui le contient, "Exploit" couvre donc ExploitA et ExploitB.
    checks:
        - Crash
        - Exploit
    # Texte du placeholder %platform% pour les joueurs Bedrock, vide pour les joueurs Java. Ajoutez %platform% à alerts-format dans messages.yml pour l'afficher dans les alertes.
    alert-tag: "&7[Bedrock] "

# Marqueurs de schéma — voir le commentaire d'en-tête dans config.yml.
config-flavor: V2
config-version: 1
