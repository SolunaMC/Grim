bedrock:
    # Gracze Bedrock (Geyser/Floodgate) nie używają ruchu Javy, dlatego Grim domyślnie ich pomija.
    # Włącz to, aby zamiast tego sprawdzać ich checkami wymienionymi poniżej. Ta funkcja jest eksperymentalna.
    enabled: false
    # Tylko te checki mogą flagować graczy Bedrock. Nazwa pasuje do każdego checka, który ją zawiera, więc "Exploit" obejmuje ExploitA i ExploitB.
    checks:
        - Crash
        - Exploit
    # Dodawany przed nazwą graczy Bedrock w alertach przez placeholder %platform%. Ustaw "", aby to wyłączyć.
    alert-tag: "&7[Bedrock] "

# Znaczniki schematu — zobacz komentarz nagłówkowy w config.yml.
config-flavor: V2
config-version: 1
