bedrock:
    # Bedrock oyuncuları (Geyser/Floodgate) Java hareketini kullanmaz, bu yüzden Grim onları varsayılan olarak muaf tutar.
    # Bunun yerine onları aşağıda listelenen kontrollerle denetlemek için bunu etkinleştirin. Bu özellik deneyseldir.
    enabled: false
    # Bedrock oyuncularını yalnızca bu kontroller işaretleyebilir. Bir ad, onu içeren her kontrolle eşleşir, yani "Exploit" ExploitA ve ExploitB'yi kapsar.
    checks:
        - Crash
        - Exploit
    # Bedrock oyuncuları için %platform% yer tutucusunun metni, Java oyuncuları için boştur. Uyarılarda göstermek için messages.yml dosyasındaki alerts-format'a %platform% ekleyin.
    alert-tag: "&7[Bedrock] "

# Şema işaretçileri — bkz. config.yml'deki başlık yorumu.
config-flavor: V2
config-version: 1
